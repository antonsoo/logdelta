[package]
name = "logdelta"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Anton Soloviev"]
description = "Diff logs by meaning, not by bytes. See what's new in the failing run."
license = "MIT"
repository = "https://github.com/antonsoo/logdelta"
homepage = "https://github.com/antonsoo/logdelta"
readme = "README.md"
keywords = ["logs", "diff", "ci", "observability", "log-parsing"]
categories = ["command-line-utilities", "development-tools"]
default-run = "logdelta"

[[bin]]
name = "logdelta"
path = "src/main.rs"

[[example]]
name = "gen_bench_log"
path = "bench/gen_bench_log.rs"

[lib]
name = "logdelta"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anstyle = "1"
anyhow = "1"
terminal_size = "0.4.4"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
