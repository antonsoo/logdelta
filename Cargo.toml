[package]
name = "logdelta"
version = "0.3.4"
edition = "2021"
rust-version = "1.85"
authors = ["Anton Soloviev <anton@praviel.com>"]
description = "Diff logs by meaning, not by bytes. See what's new in the failing run."
license = "MIT"
repository = "https://github.com/antonsoo/logdelta"
homepage = "https://antonsoo.github.io/logdelta/"
documentation = "https://docs.rs/logdelta"
readme = "README.md"
keywords = ["logs", "diff", "ci", "observability", "log-parsing"]
categories = ["command-line-utilities", "development-tools"]
default-run = "logdelta"
# The browser demo, the screenshots and the large benchmark fixtures stay in the
# repository; the published crate carries the code, its docs and the small examples.
exclude = ["/web", "/docs/assets", "/.github", "/examples/large"]

[[bin]]
name = "logdelta"
path = "src/main.rs"
required-features = ["cli"]

[[example]]
name = "gen_bench_log"
path = "bench/gen_bench_log.rs"

[lib]
name = "logdelta"
path = "src/lib.rs"

[features]
default = ["cli"]
# The command-line front end. The library (masking, mining, diffing) builds without it, e.g.
# for the WebAssembly demo in web/.
cli = ["dep:clap", "dep:terminal_size"]

[dependencies]
clap = { version = "4", features = ["derive"], optional = true }
regex = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anstyle = "1"
anyhow = "1"
terminal_size = { version = "0.4.4", optional = true }

[dev-dependencies]
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
